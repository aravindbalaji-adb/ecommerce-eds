<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Clickable Product Card</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;

        font-family: Arial, sans-serif;

        background-color: #f5f6f8;
        color: #111827;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
        gap: 24px;
      }

      /* Entire card is clickable */
      .card {
        display: block;
        overflow: hidden;

        color: inherit;
        text-decoration: none;

        background-color: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;

        cursor: pointer;

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: #cbd5e1;
        box-shadow: 0 10px 30px rgb(0 0 0 / 12%);
      }

      .card:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 3px;
      }

      .card-image {
        display: block;

        width: 100%;
        height: 220px;

        object-fit: cover;

        background-color: #f3f4f6;
      }

      .card-content {
        padding: 20px;
      }

      .card-title {
        margin: 0 0 8px;

        color: #111827;

        font-size: 20px;
        font-weight: 600;
      }

      .card-description {
        margin: 0 0 16px;

        color: #6b7280;

        font-size: 15px;
        line-height: 1.5;
      }

      .card-link {
        color: #2563eb;

        font-size: 14px;
        font-weight: 600;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px;
        }

        .cards {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }

        .card:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="cards">
      <!-- Entire card is a link -->
      <a
        href="https://www.samsung.com/"
        class="card"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View Samsung Galaxy S25 Ultra"
      >
        <img
          class="card-image"
          src="https://images.samsung.com/is/image/samsung/"
          alt="Samsung Galaxy S25 Ultra"
        />

        <div class="card-content">
          <h2 class="card-title">Samsung Galaxy S25 Ultra</h2>

          <p class="card-description">
            Powerful performance, premium camera and stunning display.
          </p>

          <span class="card-link"> View Product → </span>
        </div>
      </a>
    </div>
  </body>
</html>
