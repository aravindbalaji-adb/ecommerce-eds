<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Preview the design system button colors, variants, sizes, icons, and states.">
    <title>Button System Preview</title>
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="stylesheet" href="/styles/styles.css">
    <style>
      .button-showcase {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .button-showcase-intro,
      .button-showcase-card {
        border: 1px solid var(--color-border, #d7e1e5);
        border-radius: var(--radius-lg, 1rem);
        background: var(--color-surface, #fff);
        box-shadow: var(--shadow-sm, 0 1px 2px rgb(21 37 44 / 8%));
      }

      .button-showcase-intro {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        margin-bottom: 2rem;
        padding: 1.5rem;
      }

      .button-showcase h1,
      .button-showcase h2,
      .button-showcase h3 {
        margin-top: 0;
        color: var(--color-text, #15252c);
      }

      .button-showcase h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(1.75rem, 3vw, 2.5rem);
      }

      .button-showcase h2 {
        margin-bottom: 1rem;
        font-size: 1.5rem;
      }

      .button-showcase h3 {
        margin-bottom: 1rem;
        font-size: 1.125rem;
      }

      .button-showcase p {
        margin: 0;
        color: var(--color-text-muted, #657780);
      }

      .button-showcase-section {
        margin-top: 2rem;
      }

      .button-showcase-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
        gap: 1rem;
      }

      .button-showcase-card {
        padding: 1.25rem;
      }

      .button-showcase-row {
        display: grid;
        grid-template-columns: 5.5rem minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0;
        border-top: 1px solid var(--color-border, #d7e1e5);
      }

      .button-showcase-variant {
        color: var(--color-text-muted, #657780);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .button-showcase-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .button-showcase-controls .button {
        flex: 0 0 auto;
      }

      @media (width <= 520px) {
        .button-showcase {
          padding: 1rem 0.75rem 2rem;
        }

        .button-showcase-intro {
          align-items: flex-start;
          flex-direction: column;
          padding: 1rem;
        }

        .button-showcase-row {
          grid-template-columns: 1fr;
          gap: 0.5rem;
        }
      }
    </style>
  </head>
  <body class="appear">
    <main class="button-showcase">
      <section class="button-showcase-intro" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Button system</h1>
          <p>Color, variant, size, icon placement, and disabled-state preview.</p>
        </div>
        <button id="theme-toggle" class="button secondary outlined sm" type="button" aria-pressed="false">
          Switch to dark theme
        </button>
      </section>

      <section class="button-showcase-section" aria-labelledby="matrix-title">
        <h2 id="matrix-title">Color × variant × size · icon + label</h2>
        <div id="button-matrix" class="button-showcase-grid"></div>
      </section>

      <section class="button-showcase-section" aria-labelledby="icon-only-title">
        <h2 id="icon-only-title">Icon only · color × variant × size</h2>
        <div id="icon-only-matrix" class="button-showcase-grid"></div>
      </section>

      <section class="button-showcase-section" aria-labelledby="icon-placement-title">
        <h2 id="icon-placement-title">Icon placement</h2>
        <div id="icon-placement" class="button-showcase-controls"></div>
      </section>

      <section class="button-showcase-section" aria-labelledby="disabled-title">
        <h2 id="disabled-title">Disabled state (default md size)</h2>
        <div id="disabled-matrix" class="button-showcase-grid"></div>
      </section>
    </main>

    <script nonce="aem">
      const colors = [
        { label: 'Primary', className: 'primary' },
        { label: 'Secondary', className: 'secondary' },
        { label: 'Success', className: 'success' },
      ];
      const variants = [
        { label: 'Contained', className: 'contained' },
        { label: 'Outlined', className: 'outlined' },
        { label: 'Text', className: 'text' },
      ];
      const sizes = [
        { label: 'SM', className: 'sm' },
        { label: 'MD', className: 'md' },
        { label: 'LG', className: 'lg' },
        { label: 'Default', className: '' },
      ];

      const matrix = document.querySelector('#button-matrix');
      const iconOnlyMatrix = document.querySelector('#icon-only-matrix');
      const iconPlacement = document.querySelector('#icon-placement');
      const disabledMatrix = document.querySelector('#disabled-matrix');

      function createSearchIcon() {
        const icon = document.createElement('span');
        icon.className = 'icon icon-search';
        icon.setAttribute('aria-hidden', 'true');

        const image = document.createElement('img');
        image.src = '/icons/search.svg';
        image.alt = '';
        image.width = 24;
        image.height = 24;
        icon.append(image);
        return icon;
      }

      function createButton(color, variant, size, disabled, iconOnly = false, iconPosition = 'start') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `button ${color.className} ${variant.className} ${size.className}${iconOnly ? ' icon-only' : ''}`.trim();
        const text = disabled ? 'Unavailable' : 'Shop now';
        if (iconOnly) {
          button.setAttribute(
            'aria-label',
            `Search products, ${color.label} ${variant.label} ${size.label || 'default'}${disabled ? ', disabled' : ''}`,
          );
        }
        button.disabled = disabled;

        const icon = createSearchIcon();
        if (iconPosition === 'end' && !iconOnly) {
          button.append(text, icon);
        } else {
          button.append(icon);
          if (!iconOnly) button.append(text);
        }
        return button;
      }

      function createCard(color, disabled, iconOnly = false) {
        const card = document.createElement('section');
        card.className = 'button-showcase-card';

        const heading = document.createElement('h3');
        heading.textContent = color.label;
        card.append(heading);

        variants.forEach((variant) => {
          const row = document.createElement('div');
          row.className = 'button-showcase-row';

          const label = document.createElement('span');
          label.className = 'button-showcase-variant';
          label.textContent = variant.label;
          row.append(label);

          const controls = document.createElement('div');
          controls.className = 'button-showcase-controls';
          (disabled ? [{ label: 'MD', className: 'md' }] : sizes).forEach((size) => {
            controls.append(createButton(color, variant, size, disabled, iconOnly));
          });
          row.append(controls);
          card.append(row);
        });

        return card;
      }

      colors.forEach((color) => {
        matrix.append(createCard(color, false));
        iconOnlyMatrix.append(createCard(color, false, true));
        disabledMatrix.append(createCard(color, true));
      });

      const placementSize = { label: 'MD', className: 'md' };
      iconPlacement.append(
        createButton(colors[0], variants[0], placementSize, false, false, 'start'),
        createButton(colors[0], variants[0], placementSize, false, false, 'end'),
      );

      const themeToggle = document.querySelector('#theme-toggle');
      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.dataset.theme !== 'dark';
        if (isDark) {
          document.documentElement.dataset.theme = 'dark';
        } else {
          delete document.documentElement.dataset.theme;
        }
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.textContent = isDark ? 'Switch to light theme' : 'Switch to dark theme';
      });
    </script>
  </body>
</html>
